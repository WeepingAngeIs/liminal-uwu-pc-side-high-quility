name: Adventure route and hosted physics review
on:
  push:
    paths:
      - "Assets/Stillwater/Scenes/**"
      - "Tools/VisualReview/**"
      - "Tools/CI/Reviews/Adventure*"
      - "Tools/CI/validate_adventure.py"
      - ".github/workflows/visual-review.yml"
  pull_request:
    paths:
      - "Assets/Stillwater/Scenes/**"
      - "Tools/VisualReview/**"
      - "Tools/CI/Reviews/Adventure*"
      - "Tools/CI/validate_adventure.py"
      - ".github/workflows/visual-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify adventure routes and exact hosted physics evidence
        run: python Tools/VisualReview/verify_adventure_review.py --output route-review
      - name: Publish route measurements and hosted review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-and-quest-route-review
          path: route-review/
          if-no-files-found: error
          retention-days: 14
