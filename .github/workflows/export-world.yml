name: Export PC and Quest world bundles
on:
  workflow_dispatch:
  push:
    tags:
      - 'liminal-build-*'

permissions:
  contents: read

concurrency:
  group: liminal-unity-license
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: Android
            edition: Quest
          - platform: StandaloneWindows64
            edition: PC
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Check Unity activation settings
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo "::error::Set UNITY_EMAIL, UNITY_PASSWORD, and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in this repository's Actions secrets."
            exit 1
          fi
      - name: Restore official checksummed VRChat packages
        run: python3 Tools/CI/restore_vpm.py
      - name: Make room for the Unity editor on the hosted runner
        run: |
          # The build container supplies its own Android SDK and editor tools.
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Build VRChat world with Unity and the SDK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: LiminalExport.Build
          allowDirtyBuild: true
          versioning: None
      - name: Measure the SDK bundle and check the platform upload limit
        env:
          EDITION: ${{ matrix.edition }}
        run: python3 Tools/CI/check_bundle.py "$EDITION"
      - uses: actions/upload-artifact@v4
        with:
          name: liminal-uwu-${{ matrix.edition }}
          path: |
            Builds/${{ matrix.edition }}/liminal-uwu.vrcw
            Builds/${{ matrix.edition }}/size-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage PC ClientSim harness in the runner checkout
        if: matrix.edition == 'PC'
        run: |
          mkdir -p Assets/Editor
          cp Tools/CI/GravityRideSmoke.cs Assets/Editor/GravityRideSmoke.cs
      - name: Verify the gravity ride in PC ClientSim
        if: matrix.edition == 'PC'
        timeout-minutes: 15
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: GravityRideSmoke.Begin
          manualExit: true
          allowDirtyBuild: true
          versioning: None
