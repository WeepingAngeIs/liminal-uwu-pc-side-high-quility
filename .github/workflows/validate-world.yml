name: Validate world source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Verify both scenes, interactions, geometry, materials and sound
        run: python3 Tools/CI/validate_world.py
      - name: Verify rendered floors and doorway joins
        run: python3 Tools/CI/validate_surface_joins.py
      - name: Verify black hole geodesic texture and numerical convergence
        run: |
          python3 -m pip install numpy==2.2.6
          python3 ArtTools/black_hole_lens.py --check
      - name: Verify boarding stations, door timings and the round trip
        run: python3 Tools/CI/validate_train.py
      - name: Verify release rooms, towers, sound levels, cross-platform IDs and city film
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 Tools/CI/validate_release.py
      - name: Verify adventure progression and walkable track
        run: python3 Tools/CI/validate_adventure.py
      - name: Check official VRChat dependency restore
        run: python3 Tools/CI/restore_vpm.py

